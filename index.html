<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vous vous en souvenez ? Les dessins animés oubliés de notre enfance</title>
<meta name="description" content="La collection des dessins animés oubliés évoqués dans la série Vous vous en souvenez : clique sur un dessin animé pour revoir directement le passage où on en parle.">
<meta property="og:title" content="Vous vous en souvenez ? Les dessins animés oubliés">
<meta property="og:description" content="Redécouvre les dessins animés oubliés de ton enfance, avec un lien direct vers le moment où on en parle en vidéo.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<main>
  <div class="toolbar">
    <input type="text" id="search" placeholder="Chercher un dessin animé..." aria-label="Rechercher un dessin animé">
    <select id="sort" aria-label="Trier">
      <option value="video-desc">Vidéo la plus récente (par défaut)</option>
      <option value="year-desc">Dessin animé : plus récent</option>
      <option value="year-asc">Dessin animé : plus ancien</option>
    </select>
  </div>

  <div id="decade-filter" class="decade-filter" role="group" aria-label="Filtrer par décennie"></div>

  <div id="grid" class="grid"></div>
  <p id="empty" class="empty" hidden>Aucun dessin animé ne correspond à ta recherche.</p>
</main>

<button id="back-to-top" class="back-to-top" aria-label="Revenir en haut de la page" hidden>&uarr;</button>

<div id="modal" class="modal" hidden>
  <div class="modal-inner">
    <div class="modal-card">
      <div id="modal-bg" class="modal-bg"></div>
      <button id="close-modal" class="close-btn" aria-label="Fermer">&times;</button>
      <p id="modal-title" class="modal-title"></p>
      <div class="video-wrap">
        <iframe id="yt-frame" src="" allow="autoplay" allowfullscreen></iframe>
      </div>
      <p id="modal-meta" class="modal-meta"></p>
    </div>
    <div class="modal-nav-group">
      <button id="modal-prev" class="modal-nav" aria-label="Dessin animé précédent">&uarr;</button>
      <button id="modal-next" class="modal-nav" aria-label="Dessin animé suivant">&darr;</button>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
